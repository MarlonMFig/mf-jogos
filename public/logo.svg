<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <!-- Background Dark Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="50%" stop-color="#020617" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Gold Metallic Gradient -->
    <linearGradient id="goldMetallic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="30%" stop-color="#f59e0b" />
      <stop offset="70%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Cyan Neon Accent Gradient -->
    <linearGradient id="cyanNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Gold Border Ring Gradient -->
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>

    <!-- Radial Soft Glow -->
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#020617" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Container Squircle Background -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)" />
  
  <!-- Ambient Center Glow -->
  <circle cx="256" cy="256" r="210" fill="url(#centerGlow)" />

  <!-- Outer Luxurious Gold Border -->
  <rect x="20" y="20" width="472" height="472" rx="104" fill="none" stroke="url(#goldBorder)" stroke-width="12" />
  <rect x="28" y="28" width="456" height="456" rx="96" fill="none" stroke="#020617" stroke-width="8" />

  <!-- Crown Icon at top -->
  <g transform="translate(196, 68) scale(2.5)">
    <path d="M 5 28 L 2 10 L 14 18 L 24 4 L 34 18 L 46 10 L 43 28 Z" fill="url(#goldMetallic)" stroke="#78350f" stroke-width="1.5" stroke-linejoin="round"/>
    <!-- Crown Jewels -->
    <circle cx="2" cy="10" r="2.5" fill="#38bdf8" />
    <circle cx="24" cy="4" r="3" fill="#fef08a" />
    <circle cx="46" cy="10" r="2.5" fill="#38bdf8" />
  </g>

  <!-- Stylized Monogram "MF" -->
  <g transform="translate(0, 30)">
    <!-- Main Letter M -->
    <path d="M 120 310 L 120 180 L 160 180 L 195 245 L 230 180 L 270 180 L 270 310 L 235 310 L 235 225 L 202 275 L 188 275 L 155 225 L 155 310 Z" fill="url(#goldMetallic)" filter="drop-shadow(0px 8px 12px rgba(0,0,0,0.6))" />

    <!-- Main Letter F -->
    <path d="M 290 180 L 390 180 L 390 215 L 328 215 L 328 238 L 380 238 L 380 270 L 328 270 L 328 310 L 290 310 Z" fill="url(#goldMetallic)" filter="drop-shadow(0px 8px 12px rgba(0,0,0,0.6))" />
  </g>

  <!-- Bottom Brand Text "JOGOS" -->
  <text x="256" y="420" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="52" fill="url(#goldMetallic)" text-anchor="middle" letter-spacing="12" filter="drop-shadow(0px 4px 8px rgba(0,0,0,0.8))">
    JOGOS
  </text>

  <!-- Sparkle Stars -->
  <path d="M 85 120 L 90 135 L 105 140 L 90 145 L 85 160 L 80 145 L 65 140 L 80 135 Z" fill="#fef08a" opacity="0.9" />
  <path d="M 425 360 L 428 370 L 438 373 L 428 376 L 425 386 L 422 376 L 412 373 L 422 370 Z" fill="#38bdf8" opacity="0.9" />

  <!-- Live Status Badge (Top Right) -->
  <circle cx="420" cy="92" r="32" fill="#10b981" />
  <circle cx="420" cy="92" r="38" fill="none" stroke="#020617" stroke-width="10" />
</svg>
